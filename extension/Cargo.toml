[package]
name    = "lambdascope-extension"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "lambdascope"
path = "src/main.rs"

[dependencies]
tokio           = { version = "1",    features = ["full"] }
reqwest         = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde           = { version = "1",    features = ["derive"] }
serde_json      = "1"
tracing         = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc            = "0.2"
once_cell       = "1"

[profile.release]
opt-level = "z"
lto       = true
codegen-units = 1
strip     = true
panic     = "abort"
