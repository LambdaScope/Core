[package]
name    = "lambdascope-extension"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "lambdascope"
path = "src/main.rs"

[dependencies]
tokio              = { version = "1",    features = ["full"] }
reqwest            = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde              = { version = "1",    features = ["derive"] }
serde_json         = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc               = "0.2"
once_cell          = "1"

# kernel eBPF path
aya                = { version = "0.12", features = ["async_tokio"] }
aya-log            = "0.2"

# userspace eBPF VM (interpreter used as reference in userspace path)
rbpf               = "0.2"

# cancellation and codec utilities
tokio-util         = { version = "0.7", features = ["full"] }

# architecture-conditional constants
cfg-if             = "1.0"

# SigV4 dependencies
hmac               = "0.12"
sha2               = "0.10"
hex                = "0.4"
chrono             = "0.4"
base64             = "0.21"

[build-dependencies]
# eBPF C program compilation
aya-build          = "0.1"

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
strip         = true
panic         = "abort"
